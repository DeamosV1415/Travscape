<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travescape</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="icon" type="train-icon" href="/Travescape/home/snowflake-fill.svg">
</head>

<body>
    <div class="nav">
        <div id="nav1">
            <h2 id="menu"><i class="ri-menu-5-fill"></i></h4>
                <h1><a href="./index.html">Traves<i class="ri-snowflake-fill"></i>cape</a></h1>
        </div>
        <div id="nav2">
            <a style="text-decoration: none; color: white;" href="/index.html">
                <h4 class="a">Get Inspired</h4>
            </a>
            <h4 id="log-btn">Log in</h4>
            <a style="text-decoration: none; color: white;" href="/main/chat/index.html">
                <h4 class="a">Get Started</h4>
            </a>
        </div>
    </div>
    <div id="logincard">
        <div id="card">
            <div id="c2">
                <h2>WELCOME TO TRAVESCAPE</h2>
                <form id="loginform" action="">
                    <input id="input" type="email" name="email" placeholder="Email">
                    <button id="lgbtn" type="submit">Log in</button>
                </form>
            </div>
            <div id="c3">
                <button id="gl" type="button"> <img src="imgs/google.png" alt="">Sign in With Google</button>
                <a href="/Travescape/index.html">
                    <h4>Don't have an account? <span>Sign Up</span></h4>
                </a>
            </div>
        </div>
    </div>
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu">
            <a href="/home/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-home-2-line"></i></span>
                    <div class="name">Home</div>
                </div>
            </a>
            <a href="/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-team-line"></i></span>
                    <div class="name">Clubs</div>
                </div>
            </a>
            <a href="/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-suitcase-3-line"></i></span>
                    <div class="name">Trips</div>
                </div>
            </a>
            <a href="/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-newspaper-line"></i></span>
                    <div class="name">News</div>
                </div>
            </a>
            <a href="/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-compass-discover-line"></i></span>
                    <div class="name">Explore</div>
                </div>
            </a>
            <a href="./index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-chat-3-line"></i></span>
                    <div class="name">Chats</div>
                </div>
            </a>
        </div>

    </div>
    <div id="main">
        <div id="hero">
            <div id="hero-text">
                <h1>Discover the world</h1>
                <p><span><i class="hero-icon" class="ri-snowflake-fill"></i></span>Explore the world with
                    Travescape<span><i class="hero-icon" class="ri-snowflake-fill"></i></span></p>
            </div>
            <div id="hero-btn">
                <a href="/Travescape/main/chat/index.html" class="hero-btn-link">Get Your Escape</a>
            </div>
        </div>
        <div id="body">
            <div id="trips">
                <div id="text">
                    <h1>Get Your Trips <i id="trips-icon" class="ri-corner-right-down-line"></i></h1>
                    <a href="/Travescape/index.html">
                        <p>Explore the world with Travescape</p>
                    </a>

                </div>
                <div id="img-sec">
                    <div class="vertical">
                        <div class="trip-photo">

                        </div>
                    </div>

                </div>
            </div>
            <div id="chatbot"></div>

        </div>
        <div id="footer">

        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
