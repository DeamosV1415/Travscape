<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="icon" type="train-icon" href="/home/train-station.ico">
</head>

<body>
    <div id="main">
        <div>
            <div class="nav">
                <div id="nav1">
                    <h3><a href="/main/chat/index.html">Chat</a></h3>
                    <h3><a href="/home/index.html">Travescape</a></h3>
                    <h3><a href="/index.html">Plan Your Escapes</a></h3>
                </div>
            </div>
            <div class="side">
                <div class="s1">
                    <div id="side1">
                        <h3><i id="menu" class="ri-menu-5-line"></i></h3>
                        <h3><a href="/blogs/index.html"><i class="ri-file-paper-2-line"></i></a></h3>
                        <div class="side-child">
                            <h5>Help</h5>
                        </div>
                    </div>
                </div>
                <div id="policy">
                    <div id="po1">
                        <a href="">Contact Us</a>
                    </div>
                    <div>
                        <h5>© 2025</h5>
                        <h5>Travescape</h5>
                    </div>
                </div>

            </div>
        </div>
        <div class="menu-overlay" id="menuOverlay">
            <div class="menu">
                <a href="/home/index.html">
                    <div class="sector"></div>
                    <div class="option">
                        <span class="material-icons-round"><i class="ri-home-2-line"></i></span>
                        <div class="name">Home</div>
                    </div>
                </a>
                <a href="/index.html">
                    <div class="sector"></div>
                    <div class="option">
                        <span class="material-icons-round"><i class="ri-team-line"></i></span>
                        <div class="name">Clubs</div>
                    </div>
                </a>
                <a href="/index.html">
                    <div class="sector"></div>
                    <div class="option">
                        <span class="material-icons-round"><i class="ri-suitcase-3-line"></i></span>
                        <div class="name">Trips</div>
                    </div>
                </a>
                <a href="/index.html">
                    <div class="sector"></div>
                    <div class="option">
                        <span class="material-icons-round"><i class="ri-heart-line"></i></span>
                        <div class="name">Saved</div>
                    </div>
                </a>
                <a href="/index.html">
                    <div class="sector"></div>
                    <div class="option">
                        <span class="material-icons-round"><i class="ri-compass-discover-line"></i></span>
                        <div class="name">Explore</div>
                    </div>
                </a>
                <a href="./index.html">
                    <div class="sector"></div>
                    <div class="option">
                        <span class="material-icons-round"><i class="ri-chat-3-line"></i></span>
                        <div class="name">Chats</div>
                    </div>
                </a>
            </div>

        </div>
        <div class="chatbox">
            <div class="welcome">
                <div class="compass">
                    <div class="needle"></div>
                </div>
                <h2>Welcome to Rumi</h2>
                <p>Ask anything about travel, trips, and more!</p>
            </div>
            <div class="chat-input-wrapper">
                <div class="chat-input">
                    <textarea 
                        id="userInput" 
                        placeholder="Message Rumi..."
                        rows="1"></textarea>

                    <button id="sendBtn">
                        <i class="ri-send-plane-2-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
