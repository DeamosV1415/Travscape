<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="icon" type="train-icon" href="../../home/snowflake-fill.svg">
</head>

<body>
    <div class="navbar">
        <div class="n1">
            <h2 id="menu"><i class="ri-menu-5-fill"></i></h2>
            <div id="n1_h2" onclick="toggleChatMenu()">Chat</div>
            <div id="chatMenu" class="chat-dropdown">
                <button onclick="newChat()" class="new-chat">+ New Chat</button>
                <ul id="prevChats"></ul>
            </div>

        </div>
        <div class="n2">
            <h1><a href="../../home/index.html">Traves<i class="ri-snowflake-fill"></i>cape</a></h1>
        </div>
        <div class="n3">
            <a href="../../Coming%20soon/index.html"><button id="plan">Plan Your Escapes</button></a>
            <div id="profile"><a href="../../Coming%20soon/index.html"><img src="../../home/logo.jpg" alt=""></a></div>
        </div>
    </div>
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu">
            <a href="../../home/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-home-2-line"></i></span>
                    <div class="name">Home</div>
                </div>
            </a>
            <a href="../../Coming%20soon/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-suitcase-3-line"></i></span>
                    <div class="name">Trips</div>
                </div>
            </a>
            <a href="../../news/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-newspaper-line"></i></span>
                    <div class="name">News</div>
                </div>
            </a>
            <a href="../../Coming%20soon/index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-compass-discover-line"></i></span>
                    <div class="name">Explore</div>
                </div>
            </a>
            <a href="./index.html">
                <div class="sector"></div>
                <div class="option">
                    <span class="material-icons-round"><i class="ri-chat-3-line"></i></span>
                    <div class="name">Chats</div>
                </div>
            </a>
        </div>

    </div>
    <div class="chatbox">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-content">
                <div class="welcome-icon">
                    <i class="ri-chat-smile-3-line"></i>
                </div>
                <h1 class="welcome-title">Welcome to Travscape AI</h1>
                <p class="welcome-subtitle">Your intelligent travel companion</p>
                <p class="welcome-hint">Start typing below to begin your journey...</p>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be dynamically added here -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-bubble">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">

                <textarea id="messageInput" placeholder="Ask me anything about travel..." rows="1"
                    maxlength="2000"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="ri-send-plane-fill"></i>
                </button>
            </div>
            <div class="input-footer">
                <span class="char-count" id="charCount">0/2000</span>
                <span class="powered-by">Powered by Travscape AI</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
