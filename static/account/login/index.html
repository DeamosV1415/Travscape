<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Travescape</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>
  <div class="auth-container">
    <!-- Left Side - Image -->
    <div class="auth-image">
      <img src="https://images.unsplash.com/photo-1615080253160-beb814272000?w=1200&auto=format&fit=crop" alt="Mountains">
      <div class="auth-image-overlay"></div>
      <div class="auth-image-content">
        <h2>Your Next Adventure<br>Awaits</h2>
        <p>Sign in to access your personalized travel dashboard, saved itineraries, and exclusive member benefits.</p>
      </div>
    </div>

    <!-- Right Side - Form -->
    <div class="auth-form-container">
      <a href="/" class="back-link">
        <i class="ri-arrow-left-line"></i>
        Back to Home
      </a>

      <a href="/" class="logo" style="margin-bottom: 40px;">
        <div class="logo-icon">
          <i class="ri-sparkle-fill" style="color: white; font-size: 1.2rem;"></i>
        </div>
        <div class="logo-text">Trav<span>escape</span></div>
      </a>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your journey</p>

      <div class="error-message" id="error-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="ri-mail-line"></i>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="ri-lock-line"></i>
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" id="toggle-password">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          Sign In
        </button>
      </form>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <button class="btn-google" id="google-btn">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="switch-auth">
        Don't have an account? <a href="../signup/">Sign up</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { signInWithEmail, signInWithGoogle } from '../../js/auth-service.js?v=2';

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const googleBtn = document.getElementById('google-btn');
    const errorMessage = document.getElementById('error-message');
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePassword.innerHTML = type === 'password' 
        ? '<i class="ri-eye-line"></i>' 
        : '<i class="ri-eye-off-line"></i>';
    });

    // Show error
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      setTimeout(() => errorMessage.style.display = 'none', 5000);
    }

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="ri-loader-4-line" style="animation: spin 1s linear infinite;"></i> Signing in...';

      const { user, error } = await signInWithEmail(email, password);

      if (user) {
        window.location.href = '/';
      } else {
        showError(error || 'Invalid email or password');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Google sign in
    googleBtn.addEventListener('click', async () => {
      const { user, error } = await signInWithGoogle();
      if (user) {
        window.location.href = '/';
      } else {
        showError(error || 'Failed to sign in with Google');
      }
    });
  </script>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
