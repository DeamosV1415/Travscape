<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Destinations | Travescape</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="explore.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <script type="module" src="../js/auth-handler.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <a href="/" class="logo">
      <div class="logo-icon">
        <i class="ri-sparkle-fill" style="color: white; font-size: 1.2rem;"></i>
      </div>
      <div class="logo-text">Trav<span>escape</span></div>
    </a>

    <div class="nav-links">
      <a href="/" class="nav-link"><i class="ri-home-5-line"></i> Home</a>
      <a href="/explore/" class="nav-link active"><i class="ri-compass-3-line"></i> Explore</a>
      <a href="/chat/" class="nav-link"><i class="ri-message-3-line"></i> AI Planner</a>
      <a href="/news/" class="nav-link"><i class="ri-newspaper-line"></i> News</a>
    </div>

    <div class="nav-auth">
      <div id="auth-buttons">
        <a href="/account/login/" class="btn-ghost">Sign In</a>
        <a href="/account/signup/" class="btn-primary">Get Started</a>
      </div>
      <div id="user-menu">
        <a href="/account/profile/" class="user-btn">
          <div class="user-avatar">
            <img id="user-avatar" src="" alt="" style="display: none;">
            <i class="ri-user-3-fill" style="color: #0a1628;"></i>
          </div>
          <span id="user-name">User</span>
        </a>
        <button class="logout-btn" id="logout-btn" title="Sign Out">
          <i class="ri-logout-box-r-line"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Explore Header -->
  <section class="explore-header">
    <h1>Explore Destinations</h1>
    <p>Discover extraordinary places around the world</p>
    
    <div class="search-bar">
      <i class="ri-search-line"></i>
      <input type="text" placeholder="Search destinations, countries, or activities..." id="search-input">
      <button class="search-btn">Search</button>
    </div>
    
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="beach"><i class="ri-sun-line"></i> Beaches</button>
      <button class="filter-btn" data-filter="mountain"><i class="ri-landscape-line"></i> Mountains</button>
      <button class="filter-btn" data-filter="city"><i class="ri-building-2-line"></i> Cities</button>
      <button class="filter-btn" data-filter="island"><i class="ri-earth-line"></i> Islands</button>
    </div>
  </section>

  <!-- Destinations Grid -->
  <section class="explore-grid-section">
    <div class="destinations-grid explore-grid" id="destinations-grid">
      <!-- Cards will be generated by JS -->
    </div>
  </section>

  <script>
    const destinations = [
      { name: 'Santorini, Greece', image: 'https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?w=800', rating: 4.9, price: '$1,299', tag: 'Popular', category: 'island' },
      { name: 'Kyoto, Japan', image: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800', rating: 4.8, price: '$1,499', tag: 'Trending', category: 'city' },
      { name: 'Bali, Indonesia', image: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=800', rating: 4.9, price: '$899', tag: 'Best Value', category: 'beach' },
      { name: 'Swiss Alps', image: 'https://images.unsplash.com/photo-1528543606781-2f6e6857f318?w=800', rating: 4.7, price: '$1,899', tag: 'Adventure', category: 'mountain' },
      { name: 'Maldives', image: 'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=800', rating: 4.9, price: '$2,499', tag: 'Luxury', category: 'island' },
      { name: 'Machu Picchu, Peru', image: 'https://images.unsplash.com/photo-1587595431973-160d0d94add1?w=800', rating: 4.8, price: '$1,699', tag: 'Historic', category: 'mountain' },
      { name: 'Paris, France', image: 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=800', rating: 4.7, price: '$1,399', tag: 'Romantic', category: 'city' },
      { name: 'Phuket, Thailand', image: 'https://images.unsplash.com/photo-1589394815804-964ed0be2eb5?w=800', rating: 4.6, price: '$799', tag: 'Budget', category: 'beach' },
      { name: 'Iceland', image: 'https://images.unsplash.com/photo-1520769945061-0a448c463865?w=800', rating: 4.8, price: '$2,199', tag: 'Nature', category: 'mountain' },
      { name: 'Dubai, UAE', image: 'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=800', rating: 4.5, price: '$1,599', tag: 'Modern', category: 'city' },
      { name: 'Hawaii, USA', image: 'https://images.unsplash.com/photo-1542259009477-d625272157b7?w=800', rating: 4.7, price: '$1,899', tag: 'Paradise', category: 'beach' },
      { name: 'New Zealand', image: 'https://images.unsplash.com/photo-1507699622108-4be3abd695ad?w=800', rating: 4.9, price: '$2,299', tag: 'Adventure', category: 'mountain' }
    ];

    const grid = document.getElementById('destinations-grid');
    const filters = document.querySelectorAll('.filter-btn');
    const searchInput = document.getElementById('search-input');

    function renderDestinations(filter = 'all', search = '') {
      const filtered = destinations.filter(d => {
        const matchesFilter = filter === 'all' || d.category === filter;
        const matchesSearch = d.name.toLowerCase().includes(search.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      grid.innerHTML = filtered.map(d => `
        <div class="destination-card">
          <img src="${d.image}&auto=format&fit=crop" alt="${d.name}">
          <div class="destination-overlay"></div>
          <span class="destination-tag">${d.tag}</span>
          <button class="wishlist-btn"><i class="ri-heart-line"></i></button>
          <div class="destination-content">
            <div class="destination-rating">
              <i class="ri-star-fill"></i>
              <span>${d.rating}</span>
            </div>
            <h3 class="destination-name">${d.name}</h3>
            <p class="destination-price">From ${d.price}</p>
          </div>
        </div>
      `).join('');
    }

    filters.forEach(btn => {
      btn.addEventListener('click', () => {
        filters.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDestinations(btn.dataset.filter, searchInput.value);
      });
    });

    searchInput.addEventListener('input', () => {
      const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
      renderDestinations(activeFilter, searchInput.value);
    });

    renderDestinations();
  </script>
</body>
</html>
